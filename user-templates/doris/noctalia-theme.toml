# Palette accents doris reads for its colour distribution: `primary`
# paints the frames and the words on them, `error` the failures,
# `on_hover` the keybind glyph inside a word. `secondary` is left out
# on purpose: it falls back to hi_fg (tertiary here), which keeps the
# seed column distinct from the rose the date/badge columns draw.
primary.r = {{colors.primary.default.red}}
primary.g = {{colors.primary.default.green}}
primary.b = {{colors.primary.default.blue}}
error.r = {{colors.error.default.red}}
error.g = {{colors.error.default.green}}
error.b = {{colors.error.default.blue}}
on_hover.r = {{colors.on_surface.default.red}}
on_hover.g = {{colors.on_surface.default.green}}
on_hover.b = {{colors.on_surface.default.blue}}
